name: Update SF City Hall Lighting Calendar

on:
  schedule:
    # 1st and 2nd of each month at 12pm PST (8pm UTC) — the city posts the
    # new month's schedule on the 1st
    - cron: '0 20 1,2 * *'
    # Weekly on Mondays to pick up mid-month additions (e.g. playoff games)
    - cron: '0 20 * * 1'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies and browsers
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run scraper and generate calendar
      run: python scraper.py

    - name: Upload fetched HTML for debugging
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-page
        path: debug_page.html
        if-no-files-found: ignore
        retention-days: 14

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add calendar.ics lighting_schedule.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update City Hall lighting calendar - $(date +'%Y-%m-%d')" && git push)
